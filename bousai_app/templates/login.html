{% extends "base.html" %}

{% block title %}ログイン{% endblock %}

{% block content %}
<h2>防災支援システムにログイン</h2>
<p>管理者は111、住民は000を入力してください。</p>

{% if error %}
  <p>{{ message }}</p>
{% endif %}

<form method="post">
  <!-- リダイレクト先URLを保持 -->
  {% if next %}
    <input type="hidden" name="next" value="{{ next }}">
  {% endif %}

  <p>
    <label for="password">番号</label><br>
    <input type="password" id="password" name="password" required>
  </p>

  <p><button type="submit">ログイン</button></p>
</form>

{% endblock %}
