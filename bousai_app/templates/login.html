{% extends "base.html" %}
{% block title %}ログイン - 防災アプリ{% endblock %}
{% block content %}
<div class="auth-page"><header class="page-header"><a href="{{ url_for('index') }}" class="back-link">← ホーム</a><h1>防災支援システムにログイン</h1><p>登録された番号を入力してください。</p></header><form class="auth-form panel" method="post">{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}{% if error %}<p class="form-message error-message" role="alert">{{ message }}</p>{% endif %}<label for="password">ログイン番号</label><input type="password" id="password" name="password" inputmode="numeric" required autofocus><p class="login-hint">管理者: 111　住民: 000</p><button class="primary-action" type="submit">ログイン</button></form></div>
{% endblock %}
